<!doctype html>
<html lang="pt-BR" class="kk-theme-light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kobi Note</title>
  <meta name="description" content="Notas, estudo, finanças e preparo — offline-first." />
  <link rel="icon" href="./icons/kobi-note.svg" type="image/svg+xml" />
  <!--
      PNG, e não o SVG do `rel="icon"`: o Safari do iOS ignora apple-touch-icon
      em SVG, sem erro nenhum, e a tela de início fica com uma miniatura da
      página no lugar do ícone do app. É o único formato que ele aceita aqui.
    -->
  <link rel="apple-touch-icon" href="./icons/kobi-note-apple-touch-icon.png" />
  <!--
      Tema antes da primeira pintura: sem isto a página nasce clara e pisca para
      escura quando o módulo carrega. Espelha o que src/tema.ts faz depois.
      A <meta name="theme-color"> acompanha, para a barra do sistema no modo
      instalado não destoar da tela.
    -->
  <meta name="theme-color" content="#ffffff" />
  <!--
      Idioma antes da primeira pintura, pela mesma razão do tema: o `lang` do
      <html> é o que os componentes do Kobi Kit leem ao nascer, e trocá-lo depois
      de a casca desenhar faria a moldura piscar de um idioma para o outro. O
      `pt-BR` do atributo acima é o padrão — este bloco só o substitui quando o
      aparelho pediu outro. O app confirma a escolha em `i18n/idioma.ts`; aqui é
      só o que não pode esperar o módulo carregar.
    -->
  <script>
    (() => {
      const idioma = localStorage.getItem('note_idioma');
      if (idioma) document.documentElement.lang = idioma;

      const salvo = localStorage.getItem('note_tema');
      const escuro =
        salvo === 'escuro' ||
        (salvo === null && matchMedia('(prefers-color-scheme: dark)').matches);
      const raiz = document.documentElement.classList;
      raiz.toggle('kk-theme-dark', escuro);
      raiz.toggle('kk-theme-light', !escuro);
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute('content', escuro ? '#0f1115' : '#ffffff');
    })();
  </script>

  <link rel="modulepreload" crossorigin href="./assets/plural-0_xhPFb3.js">
  <link rel="modulepreload" crossorigin href="./assets/banco-DT6T_b91.js">
  <link rel="modulepreload" crossorigin href="./assets/texto-DhKYsM3f.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DqLHvoJd.css">
<link rel="manifest" href="./manifest.webmanifest"></head>

<body>

</body>

</html>
