  <text
     class="cab"
     x="46"
     y="54"
     id="text5">A MATEMÁTICA DOS ESPORTES</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text6">No bilhar não basta força: a bola obedece a uma regra — e quem sabe a regra vê a jogada antes de dar a tacada.</text>
