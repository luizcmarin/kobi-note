     y="54"
     id="text4">A HARMONIA OCULTA NA MÚSICA</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text5">Pitágoras não inventou a harmonia: ele mediu a corda e achou frações simples.</text>
  <!-- ══ Esquerda: o monocórdio ═════════════════════════════════════════ -->
