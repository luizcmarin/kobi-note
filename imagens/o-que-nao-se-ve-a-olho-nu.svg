      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text45">O feixe de elétrons: milhões de ×</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text46">Só com ele — e com o microscópio de tunelamento —</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text47">os átomos aparecem, um a um, enfileirados numa</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text48">grade regular. Nunca num monte desordenado.</text>
    </g>
