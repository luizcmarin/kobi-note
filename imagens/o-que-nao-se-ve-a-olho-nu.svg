  <text
     class="cab"
     x="46"
     y="54"
     id="text2">O QUE NÃO SE VÊ A OLHO NU</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text3">
        Cada degrau da escada multiplica a ampliação por 10 — e, a cada degrau, aparece mais ordem, não menos.
    </text>
