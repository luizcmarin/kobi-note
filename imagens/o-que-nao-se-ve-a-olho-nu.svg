       id="text36">ONDE CADA INSTRUMENTO PARA DE ENXERGAR</text>
    <g
       transform="translate(30,64)"
       id="g40">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#eef7f3"
         stroke="#bfd9cf"
         stroke-width="1.5"
         id="rect37" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text37">O olho: até ~0,1 mm</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text38">É o limite. Abaixo disso, tudo o que existe some</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text39">— e o que some é a maior parte do mundo. Foi só</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text40">com a lente que a humanidade descobriu isso.</text>
    </g>
    <g
       transform="translate(452,64)"
       id="g44">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#eef7f3"
         stroke="#bfd9cf"
         stroke-width="1.5"
         id="rect40" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text41">O microscópio de luz: ~2.000×</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text42">Enxerga a gota, a célula, a bactéria. Mas a própria</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text43">luz é &quot;grossa&quot; demais para mostrar uma molécula:</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text44">daí em diante, é preciso outro tipo de olho.</text>
    </g>
    <g
       transform="translate(874,64)"
