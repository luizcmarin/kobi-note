           x="18"
           y="23">Só estas <tspan
   font-weight="700"
   style="fill:#8a6a1f"
   id="tspan24">três formas regulares</tspan> ladrilham o plano.</tspan><tspan
           sodipodi:role="line"
           id="tspan56"
           x="18"
           y="40.5">Todas as outras deixam vão. Agora, entre as três, é conta.</tspan></text>
