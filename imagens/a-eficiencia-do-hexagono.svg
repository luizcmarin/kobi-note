     x="46"
     y="54"
     id="text4">A EFICIÊNCIA DO HEXÁGONO</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text5">Guardar o máximo de mel gastando o mínimo de cera — e a abelha resolve isso desde que nasce.</text>
  <!-- ══ Esquerda: quem consegue ladrilhar ══════════════════════════════ -->
