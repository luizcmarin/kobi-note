         font-weight="700"
         id="text45">o favo, de verdade</text>
    </g>
    <g
       transform="translate(266,44)"
       id="g50">
      <text
         class="rot"
         x="0"
         y="26"
         font-size="17"
         id="text46">O que a abelha resolveu antes de nós</text>
      <text
         class="rotp"
         x="0"
         y="58"
         id="text47">Que o hexágono era a melhor forma, a abelha já &quot;sabia&quot;. Que ele é</text>
      <text
         class="rotp"
         x="0"
         y="82"
         id="text48">realmente o melhor de TODOS os jeitos de dividir um plano — inclusive</text>
      <text
         class="rotp"
         x="0"
         y="106"
         id="text49">os tortos, irregulares, que ninguém tinha testado — só foi provado em</text>
      <text
         class="rotp"
         x="0"
         y="130"
         id="text50">1999, pelo matemático Thomas Hales. Levou dois mil anos de matemática.</text>
    </g>
    <g
       transform="translate(946,44)"
       id="g54">
      <rect
         x="0"
         y="0"
         width="332"
         height="126"
         rx="12"
         fill="#fdf3d4"
         stroke="#c9701e"
         stroke-width="2"
         id="rect50" />
      <text
         class="rot"
         x="20"
         y="34"
         font-size="16"
         style="fill:#c9701e"
         id="text51">E ela não usa régua</text>
      <text
         class="rotp"
         x="20"
         y="62"
         id="text52">Nenhuma abelha aprendeu geometria.</text>
      <text
         class="rotp"
         x="20"
         y="86"
         id="text53">Nenhuma mediu 120°. Cada uma faz a</text>
      <text
         class="rotp"
         x="20"
         y="110"
         id="text54">sua parte — e sai o favo perfeito.</text>
    </g>
  </g>
  <text
     class="rotp"
     x="46"
     y="768"
     font-size="15"
     id="text55">
        Um quilo de cera custa à colmeia cerca de seis quilos de mel: cada milímetro de parede economizado é comida guardada.
    </text>
</svg>
