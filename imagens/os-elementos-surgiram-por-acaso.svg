  <text
     class="cab"
     x="46"
     y="54"
     id="text2">OS ELEMENTOS QUÍMICOS SURGIRAM POR ACASO?</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text3">
        Tudo — até a estrela mais distante — é feito de átomos. E o que decide QUAL elemento? Só o número de prótons no núcleo.
    </text>
