         x="22"
         y="92"
         font-size="15"
         id="text65">80 prótons: mercúrio, líquido prateado.</text>
      <text
         class="rotp"
         x="22"
         y="112"
         font-size="15"
         id="text66">Pequenas mudanças na disposição das</text>
      <text
         class="rotp"
         x="22"
         y="132"
         font-size="15"
         id="text67">partículas criam a enorme variedade</text>
      <text
         class="rotp"
         x="22"
         y="152"
         font-size="15"
         id="text68">de tudo o que existe.</text>
      <text
         class="num ok"
         x="22"
         y="192"
         font-size="16"
         id="text69">Variedade com regras é projeto.</text>
    </g>
    <g
       transform="translate(886,0)"
       id="g76">
      <rect
         class="painel"
         width="468"
         height="224"
         rx="16"
         id="rect69" />
      <text
         class="rot"
         x="22"
         y="40"
         id="text70">VOCÊ É FEITO DESSA ESCADA</text>
      <text
         class="rotp"
         x="22"
         y="72"
         font-size="15"
         id="text71">Hidrogênio + oxigênio + carbono somam</text>
      <text
         class="rotp"
         x="22"
         y="92"
         font-size="15"
         id="text72">~98% dos átomos do seu corpo (o carbono</text>
      <text
         class="rotp"
         x="22"
         y="112"
         font-size="15"
         id="text73">é 20% do peso de todo ser vivo).</text>
      <text
         class="rotp"
         x="22"
         y="140"
         font-size="15"
         font-style="italic"
         id="text74">“Você conhece as leis que governam</text>
      <text
         class="rotp"
         x="22"
         y="160"
         font-size="15"
         font-style="italic"
         id="text75">o céu?” — Jó 38:33</text>
      <text
         class="num ok"
         x="22"
         y="192"
         font-size="16"
         id="text76">Isso teve um Projeto?</text>
    </g>
  </g>
</svg>
