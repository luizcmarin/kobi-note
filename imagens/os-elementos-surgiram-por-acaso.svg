         x="22"
         y="152"
         font-size="15"
         id="text61">se encaixaram no padrão da tabela.</text>
      <text
         class="num ok"
         x="22"
         y="192"
         font-size="16"
         id="text62">Ordem que prevê o futuro não é acaso.</text>
    </g>
    <g
