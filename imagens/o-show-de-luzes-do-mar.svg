            </text>
      <text
         class="rotp"
         x="180"
         y="30"
         id="text28">— com a luciferase —</text>
      <text
         class="rot"
         x="402"
         y="30"
         text-anchor="end"
         font-size="16"
         style="fill:#7ef0d8"
         id="text29">luz</text>
      <text
         class="rotp"
         x="18"
         y="56"
         font-size="13"
         id="text30">
                Uma reação química entrega a energia direto como luz:
            </text>
      <text
         class="rotp"
         x="18"
         y="74"
         font-size="13"
         id="text31">
                ela não passa pelo calor em nenhum momento.
            </text>
    </g>
  </g>
  <!-- ══ Rodapé: o brilho certo ═════════════════════════════════════════ -->
  <g
     transform="translate(46,520)"
