       y="38"
       style="fill:#7ef0d8"
       id="text19">DE ONDE VEM A LUZ</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text20">não há filamento, nem fio, nem tomada</text>
    <!-- a água-viva -->
