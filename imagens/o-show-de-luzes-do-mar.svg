       class="rot"
       x="24"
       y="38"
       id="text32">E O BRILHO TEM DE SER O CERTO</text>
    <g
       transform="translate(30,64)"
       id="g35">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#08182a"
         stroke="#3d5a6b"
         stroke-width="1.5"
         id="rect33" />
      <circle
         cx="60"
         cy="60"
         r="22"
         fill="#7ef0d8"
         opacity="0.2"
         id="circle33" />
      <text
         class="rot"
         x="102"
         y="46"
         font-size="16"
         style="fill:#8aa8bd"
         id="text33">Fraco demais</text>
      <text
         class="rotp"
         x="102"
         y="74"
         id="text34">o plâncton nem enxerga o brilho</text>
      <text
         class="rotp"
         x="102"
         y="96"
         id="text35">— e ninguém vem</text>
    </g>
    <g
       transform="translate(452,64)"
