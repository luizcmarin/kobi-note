      <circle
         cx="60"
         cy="60"
         r="12"
         fill="#7ef0d8"
         id="circle36" />
      <text
         class="rot"
         x="102"
         y="46"
         font-size="16"
         style="fill:#7ef0d8"
         id="text36">O ponto certo</text>
      <text
         class="rotp"
         x="102"
         y="74"
         style="fill:#7ef0d8"
         id="text37">atrai o plâncton para perto</text>
      <text
         class="rotp"
         x="102"
         y="96"
         style="fill:#7ef0d8"
         id="text38">da boca — e só ele</text>
    </g>
    <g
       transform="translate(874,64)"
       id="g41">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
