  <title
     id="tit">O Show de Luzes do Mar — a luz fria</title>
  <desc
     id="desc">Na lâmpada de filamento, quase toda a energia vira calor e só uma pequena parte
        vira luz. Na bioluminescência acontece o contrário: a reação química entrega quase tudo em
        luz e quase nada em calor — é a luz fria. E o brilho tem de ser o certo: fraco demais não
        atrai o plâncton; forte demais entrega a criatura ao predador.</desc>
  <defs
     id="defs4">
    <linearGradient
       id="fundo"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#08243a"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#02090f"
         id="stop2" />
    </linearGradient>
    <radialGradient
       id="brilho"
       cx="0.5"
       cy="0.5"
       r="0.5">
      <stop
         offset="0"
         stop-color="#7ef0d8"
         stop-opacity="0.95"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#7ef0d8"
         stop-opacity="0"
         id="stop4" />
    </radialGradient>
  </defs>
  <style
     id="style4">
        .cab  { fill:#e6fbff; font-size:28px; font-weight:800; letter-spacing:1.2px; }
        .rot  { fill:#cfeef5; font-size:18px; font-weight:700; }
        .rotp { fill:#84aebd; font-size:14px; }
        .painel { fill:#0a2032; stroke:#2f6f8a; stroke-width:2; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#fundo)"
     id="rect4" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text4">O SHOW DE LUZES DO MAR</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text5">A lâmpada esquenta e ilumina de sobra. A água-viva ilumina — e não esquenta nada.</text>
  <!-- ══ Esquerda: para onde vai a energia ══════════════════════════════ -->
  <g
     transform="translate(46,112)"
     id="g19">
    <rect
       class="painel"
       x="0"
       y="0"
       width="812"
       height="380"
       rx="16"
       id="rect5" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text6">DE CADA 100 DE ENERGIA, QUANTO VIRA LUZ</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text7">a luz fria não queima — por isso a água-viva brilha colada na própria pele</text>
    <!-- lâmpada de filamento -->
    <g
