         id="text14">40 de luz</text>
      <text
         class="rotp"
         x="516"
         y="90"
         text-anchor="middle"
         style="fill:#ff8f6b"
         id="text15">60 de calor</text>
    </g>
    <!-- bioluminescência -->
    <g
       transform="translate(30,274)"
       id="g18">
      <text
         class="rot"
         x="0"
         y="16"
         font-size="16"
         style="fill:#7ef0d8"
         id="text16">A água-viva — luz fria</text>
      <rect
         x="0"
         y="30"
         width="740"
         height="38"
         rx="8"
         fill="#0a1622"
         stroke="#7ef0d8"
         stroke-width="2"
         id="rect16" />
      <rect
         x="2"
         y="32"
         width="707"
         height="34"
         rx="6"
         fill="#7ef0d8"
         id="rect17" />
      <rect
         x="709"
         y="32"
         width="29"
         height="34"
         rx="6"
         fill="#c0392b"
         opacity="0.75"
         id="rect18" />
      <text
         class="rotp"
         x="0"
         y="90"
         style="fill:#7ef0d8"
         font-weight="700"
         id="text18">quase tudo vira luz — e quase nada vira calor</text>
    </g>
  </g>
  <!-- ══ Direita: a reação ══════════════════════════════════════════════ -->
  <g
     transform="translate(886,112)"
     id="g32">
    <rect
       class="painel"
       x="0"
       y="0"
       width="468"
       height="380"
