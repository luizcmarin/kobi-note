         id="circle34" />
    </g>
    <text
       class="rotp"
       x="300"
       y="284"
       text-anchor="middle"
       id="text34">a rede de bolhas, feita em espiral apertada</text>
  </g>
  <!-- ══ Baixo-direita: a cópia humana ═════════════════════════════════ -->
  <g
