         cy="126"
         r="4"
         id="circle31" />
    </g>
    <!-- a baleia, subindo pela espiral -->
    <g
       transform="translate(300,194) rotate(-12) scale(0.8)"
       id="g34">
      <path
         d="M-96 0 C -60 -34, 60 -40, 108 -12 C 120 -6, 120 6, 108 12                      C 60 40, -60 34, -96 0 Z"
         fill="url(#pele)"
         id="path31" />
      <path
         d="M-96 0 L -138 -26 L -128 0 L -138 26 Z"
         fill="#26374a"
         id="path32" />
      <!-- as nadadeiras longas, com o bordo ondulado -->
      <path
         d="M-30 -8 C -60 -60, -20 -96, 30 -84 C 10 -56, -6 -30, -18 -8 Z"
         fill="#3d5063"
         id="path33" />
      <path
         d="M-30 8 C -60 60, -20 96, 30 84 C 10 56, -6 30, -18 8 Z"
