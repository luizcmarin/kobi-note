           cx="-136"
           cy="-4"
           r="9"
           id="circle15" />
        <circle
           cx="-108"
           cy="-13"
           r="10"
           id="circle16" />
        <circle
           cx="-78"
           cy="-20"
           r="10"
           id="circle17" />
        <circle
           cx="-46"
           cy="-25"
           r="10"
           id="circle18" />
        <circle
           cx="-14"
           cy="-29"
           r="10"
           id="circle19" />
        <circle
           cx="18"
           cy="-30"
           r="10"
           id="circle20" />
        <circle
           cx="50"
           cy="-28"
           r="9"
           id="circle21" />
        <circle
           cx="82"
           cy="-24"
           r="9"
           id="circle22" />
      </g>
    </g>
    <!-- os filetes passam entre os tubérculos e continuam grudados na superfície -->
    <g
