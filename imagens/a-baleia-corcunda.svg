       y="38"
       id="text26">O QUE A BALEIA GANHA</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text27">curvas fechadas para cercar o cardume — sem estolar</text>
    <!-- espiral da rede de bolhas -->
