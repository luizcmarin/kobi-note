             id="path39" />
          <circle
             cx="34"
             cy="-11"
             r="5"
             id="circle40" />
          <circle
             cx="58"
             cy="-14"
             r="5"
             id="circle41" />
          <circle
             cx="82"
             cy="-13"
             r="5"
             id="circle42" />
          <circle
             cx="106"
             cy="-9"
             r="5"
             id="circle43" />
        </g>
        <g
