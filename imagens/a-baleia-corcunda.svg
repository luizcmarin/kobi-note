  <title
     id="tit">A Baleia-Corcunda — os tubérculos que adiam o estol</title>
  <desc
     id="desc">Borda lisa: em ângulo forte, a água descola da nadadeira, vira turbulência e a
        sustentação some (estol). Borda com tubérculos: as saliências dividem a água em filetes que
        seguem colados, e a nadadeira continua sustentando em ângulos bem maiores. Pás de turbina
        copiaram o bordo ondulado.</desc>
  <defs
     id="defs4">
    <linearGradient
       id="mar"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#dff1fb"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#bcdff3"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="pele"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#4a5f74"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#26374a"
         id="stop4" />
    </linearGradient>
    <marker
       id="sp-2f7fd0"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="9"
       markerHeight="9"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#2f7fd0"
         id="path4" />
    </marker>
  </defs>
  <style
     id="style4">
        .cab  { fill:#12303f; font-size:28px; font-weight:800; letter-spacing:1.2px; }
        .rot  { fill:#12303f; font-size:18px; font-weight:700; }
        .rotp { fill:#3f6579; font-size:14px; }
        .painel { fill:#f6fcff; stroke:#8fbdd4; stroke-width:2; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#mar)"
     id="rect4" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text4">A BALEIA-CORCUNDA</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text5">Por que uma nadadeira teria &quot;dentes&quot; na borda da frente?</text>
  <!-- ══ Cima-esquerda: borda LISA, a água descola ══════════════════════ -->
  <g
     transform="translate(60,130)"
     id="g14">
    <rect
       class="painel"
       x="0"
       y="0"
       width="600"
       height="270"
       rx="16"
       id="rect5" />
    <text
       class="rot"
       x="24"
       y="38"
       style="fill:#b0301f"
       id="text6">BORDA LISA</text>
    <text
       class="rotp"
       x="24"
       y="62"
       id="text7">em ângulo forte, a água descola do bordo</text>
    <!-- perfil da nadadeira, inclinado (ângulo de ataque grande) -->
    <g
       transform="translate(300,150) rotate(-20)"
       id="g7">
      <path
         d="M-150 0 C -110 -26, 0 -34, 150 -8 L 150 8 C 0 4, -110 18, -150 0 Z"
         fill="url(#pele)"
         id="path7" />
    </g>
    <!-- filetes de água: colados até o bordo, depois se soltam em turbilhões -->
    <g
       fill="none"
       stroke="#2f7fd0"
       stroke-width="3"
       id="g10">
      <path
         d="M40 96 C 110 74, 180 70, 250 84"
         marker-end="url(#sp-2f7fd0)"
         id="path8" />
      <path
         d="M40 130 C 110 108, 180 104, 240 116"
         id="path9" />
      <path
         d="M40 164 C 110 150, 180 152, 236 158"
         id="path10" />
    </g>
    <!-- descolamento: redemoinhos atrás da nadadeira -->
    <g
       fill="none"
       stroke="#d63f2a"
       stroke-width="3"
       id="g13">
      <path
         d="M330 96 C 372 78, 404 96, 386 124 C 370 146, 340 136, 344 112"
         id="path11" />
      <path
         d="M420 120 C 462 102, 494 120, 476 148 C 460 170, 430 160, 434 136"
         id="path12" />
      <path
         d="M366 176 C 408 158, 440 176, 422 204 C 406 226, 376 216, 380 192"
         id="path13" />
    </g>
    <text
       class="rot"
       x="325.03497"
       y="250.7972"
       font-size="16"
       style="fill:#b0301f"
       id="text13">ESTOL: a sustentação SOME</text>
  </g>
  <!-- ══ Cima-direita: borda com TUBÉRCULOS, a água segue colada ════════ -->
  <g
     transform="translate(700,130)"
     id="g26">
