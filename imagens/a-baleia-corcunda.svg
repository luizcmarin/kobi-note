       y="38"
       id="text35">A ENGENHARIA COPIOU</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text36">pás de turbina e ventiladores com o bordo ondulado</text>
    <!-- cubo e três pás onduladas -->
    <g
       transform="translate(300,164) scale(0.85)"
