          <circle
             cx="34"
             cy="-11"
             r="5"
             id="circle44" />
          <circle
             cx="58"
             cy="-14"
             r="5"
             id="circle45" />
          <circle
             cx="82"
             cy="-13"
             r="5"
             id="circle46" />
          <circle
