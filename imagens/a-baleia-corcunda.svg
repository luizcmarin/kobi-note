    </g>
    <text
       class="rot"
       x="330"
       y="248"
       font-size="16"
       style="fill:#1f7a3d"
       id="text25">SUSTENTAÇÃO MANTIDA</text>
  </g>
  <!-- ══ Baixo-esquerda: a curva fechada que isso permite ═══════════════ -->
  <g
     transform="translate(60,440)"
     id="g35">
    <rect
       class="painel"
