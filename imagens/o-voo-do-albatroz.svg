       style="fill:#1d5a86"
       id="text24">AR = b² ÷ S</text>
    <text
       class="rotp"
       x="24"
       y="126"
       id="text25">envergadura ao quadrado, dividida pela área da asa</text>
    <g
       transform="translate(24,148)"
