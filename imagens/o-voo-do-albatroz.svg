      </g>
      <ellipse
         cx="0"
         cy="4"
         rx="22"
         ry="62"
         fill="#dfe9f0"
         stroke="#5b8bab"
         stroke-width="2"
         id="ellipse17" />
      <circle
         cx="0"
         cy="-70"
         r="18"
         fill="#dfe9f0"
         stroke="#5b8bab"
         stroke-width="2"
         id="circle17" />
      <path
         d="m -8,-84 8,-24 8,24 z"
         fill="#e8c27a"
         stroke="#b08c46"
         stroke-width="1.5"
         id="path17" />
      <!-- redemoinhos de ponta: pequenos -->
      <g
         fill="none"
         stroke="#1f7a3d"
         stroke-width="2.5"
         id="g19">
        <path
           d="m 300,-12 c 24,-10 30,24 8,24"
           id="path18" />
        <path
