       x="0"
       y="0"
       width="640"
       height="380"
       rx="16"
       id="rect15" />
    <text
       class="rot"
       x="24"
       y="38"
       style="fill:#1f7a3d"
       id="text16">ASA LONGA E ESTREITA</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text17">a asa do albatroz — razão de aspecto alta</text>
    <g
       transform="matrix(0.9440598,0,0,1.0004686,319.97747,190.01016)"
       id="g20">
      <g
         fill="url(#asa)"
         stroke="#5b8bab"
         stroke-width="2.5"
         id="g17"
