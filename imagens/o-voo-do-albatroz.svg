       fill="none"
       id="g21">
      <path
         d="M24 300 H 616"
         marker-start="url(#ini-1d5a86)"
         marker-end="url(#s2-1d5a86)"
         id="path20" />
    </g>
    <text
       class="rot"
       x="320"
       y="326"
       text-anchor="middle"
       font-size="16"
       id="text21">b = envergadura (longa)</text>
    <text
       class="rotp"
       x="320"
       y="358"
       text-anchor="middle"
       style="fill:#1f7a3d"
       font-weight="700"
       id="text22">
            redemoinho quase nenhum: a asa desliza limpa pelo ar
        </text>
  </g>
  <!-- ══ Baixo-esquerda: a conta ════════════════════════════════════════ -->
  <g
     transform="translate(46,520)"
