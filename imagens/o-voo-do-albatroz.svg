       y="326"
       text-anchor="middle"
       font-size="16"
       id="text14">b = envergadura (curta)</text>
    <text
       class="rotp"
       x="320"
       y="358"
       text-anchor="middle"
       style="fill:#c04a2e"
       font-weight="700"
       id="text15">
            redemoinho grande na ponta: a asa é freada o tempo todo
        </text>
  </g>
  <!-- ══ Direita: asa longa e estreita ══════════════════════════════════ -->
  <g
     transform="translate(714,112)"
