      <rect
         x="0"
         y="0"
         width="270"
         height="46"
         rx="8"
         fill="#fdeae4"
         stroke="#c04a2e"
         stroke-width="1.5"
         id="rect25" />
      <text
         class="rot"
         x="16"
         y="30"
         font-size="16"
         style="fill:#c04a2e"
         id="text26">asa larga:  AR ≈ 6</text>
      <rect
         x="300"
         y="0"
         width="270"
         height="46"
         rx="8"
         fill="#e6f6ea"
         stroke="#1f7a3d"
         stroke-width="1.5"
         id="rect26" />
      <text
         class="rot"
         x="316"
         y="30"
         font-size="16"
         style="fill:#1f7a3d"
         id="text27">albatroz:  AR ≈ 25</text>
    </g>
  </g>
  <!-- ══ Baixo-direita: o planeio ═══════════════════════════════════════ -->
  <g
     transform="translate(714,520)"
     id="g36">
    <rect
       class="painel"
       x="0"
       y="0"
       width="640"
       height="212"
       rx="16"
       id="rect28" />
    <text
       class="rot"
       x="24"
       y="40"
       id="text28">O QUE ISSO DÁ NO AR</text>
    <text
       class="rotp"
       x="24"
       y="62"
       id="text29">para cada 1 metro que a ave cai, quanto ela avança à frente</text>
    <!-- eixos do planeio -->
    <g
       transform="translate(40,84)"
       id="g35">
      <path
         d="M0 0 V 96"
         stroke="#9cc4dd"
         stroke-width="2"
         id="path29" />
      <path
         d="M0 96 H 560"
         stroke="#9cc4dd"
         stroke-width="2"
         id="path30" />
      <!-- planeio íngreme (asa larga) -->
      <path
         d="M0 6 L 160 96"
         stroke="#c04a2e"
