         id="text33">desce quase de lado</text>
      <text
         class="rot"
         x="500"
         y="66"
         font-size="15"
         style="fill:#1f7a3d"
         id="text34">≈ 22 m</text>
      <text
         class="rotp"
         x="-30"
         y="4"
         transform="rotate(-90,-30,4)"
         text-anchor="end"
         id="text35">1 m de queda</text>
    </g>
  </g>
  <text
     class="rotp"
     x="46"
     y="768"
     font-size="15"
     id="text36">
        O albatroz-gigante cruza milhares de quilômetros de oceano e passa horas no ar sem dar uma única batida de asa.
    </text>
</svg>
