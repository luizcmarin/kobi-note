         fill="#e8c27a"
         stroke="#b08c46"
         stroke-width="1.5"
         id="path10" />
      <!-- redemoinhos de ponta: grandes -->
      <g
         fill="none"
         stroke="#c04a2e"
         stroke-width="3"
         id="g12">
        <path
           d="M236 -20 C 292 -44, 312 26, 258 34 C 224 39, 222 -2, 250 -6"
           id="path11" />
        <path
           d="M-236 -20 C -292 -44, -312 26, -258 34 C -224 39, -222 -2, -250 -6"
           id="path12" />
      </g>
    </g>
    <!-- cotas -->
    <g
       stroke="#1d5a86"
       stroke-width="2"
       fill="none"
       id="g14">
      <path
         d="M90 300 H 550"
         marker-start="url(#ini-1d5a86)"
         marker-end="url(#s2-1d5a86)"
         id="path13" />
    </g>
    <text
       class="rot"
