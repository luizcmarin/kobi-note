  <title
     id="tit">O Voo do Albatroz — a razão de aspecto da asa</title>
  <desc
     id="desc">Duas asas com a mesma área, vistas de cima. A asa curta e larga tem razão de aspecto
        baixa: a ponta gera um redemoinho grande, que puxa a ave para trás, e o planeio cai rápido.
        A asa longa e estreita do albatroz tem razão de aspecto alta (AR = b² dividido por S): o
        redemoinho de ponta é pequeno e cada metro de queda rende muitos metros à frente.</desc>
  <defs
     id="defs7">
    <linearGradient
       id="ceu"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#e3f2fc"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#b7d9ee"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="asa"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#fdfdfd"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#cfdde7"
         id="stop4" />
    </linearGradient>
    <marker
       id="ini-1d5a86"
       viewBox="0 0 10 10"
