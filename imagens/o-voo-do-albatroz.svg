  <style
     id="style7">
        .cab  { fill:#0f3350; font-size:28px; font-weight:800; letter-spacing:1.2px; }
        .rot  { fill:#1d5a86; font-size:18px; font-weight:700; }
        .rotp { fill:#527f9d; font-size:14px; }
        .painel { fill:#ffffff; stroke:#9cc4dd; stroke-width:2; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#ceu)"
     id="rect7" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text7">O VOO DO ALBATROZ</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text8">A mesma área de asa, esticada de outro jeito — e o pássaro cruza o oceano sem bater as asas.</text>
  <!-- ══ Esquerda: asa curta e larga ════════════════════════════════════ -->
  <g
     transform="translate(46,112)"
     id="g15">
    <rect
       class="painel"
       x="0"
       y="0"
       width="640"
       height="380"
       rx="16"
       id="rect8" />
    <text
       class="rot"
       x="24"
       y="38"
       style="fill:#c04a2e"
       id="text9">ASA CURTA E LARGA</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text10">vista de cima — razão de aspecto baixa</text>
    <!-- planta da asa: envergadura pequena, corda grande -->
    <g
       transform="translate(320,190)"
       id="g13">
      <!-- as duas metades da asa: a de baixo é a mesma, espelhada -->
      <g
         fill="url(#asa)"
         stroke="#5b8bab"
         stroke-width="2.5"
         id="g10">
        <path
           id="asaLarga"
           d="M14 -60 C 86 -70, 166 -60, 222 -40                          C 242 -33, 244 -6, 224 2                          C 166 22, 86 46, 16 56 Z" />
        <use
           href="#asaLarga"
           transform="scale(-1,1)"
           id="use10" />
      </g>
      <!-- corpo, cabeça e bico, vistos de cima -->
      <ellipse
         cx="0"
         cy="4"
         rx="24"
         ry="68"
         fill="#dfe9f0"
         stroke="#5b8bab"
         stroke-width="2"
         id="ellipse10" />
      <circle
         cx="0"
         cy="-76"
         r="19"
         fill="#dfe9f0"
         stroke="#5b8bab"
         stroke-width="2"
         id="circle10" />
      <path
