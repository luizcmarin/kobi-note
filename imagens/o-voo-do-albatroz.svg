         fill="none"
         marker-end="url(#s2-c04a2e)"
         id="path31" />
      <text
         class="rotp"
         x="72"
         y="44"
         style="fill:#c04a2e"
         font-weight="700"
         id="text31">cai rápido</text>
      <text
         class="rot"
         x="172"
         y="90"
         font-size="15"
         style="fill:#c04a2e"
         id="text32">≈ 7 m</text>
      <!-- planeio raso (albatroz) -->
      <path
