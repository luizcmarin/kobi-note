     inkscape:window-width="1920"
     inkscape:window-height="1008"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg51" />
  <title
     id="tit">O Ano Extraordinário de Einstein — 1905, o tempo elástico e E = mc²</title>
  <desc
     id="desc">O jogo pede que a nave chegue a γ = 2; esta ilustração mostra de onde vem o número.
        A tabela liga a velocidade ao fator γ (10% de c quase não muda nada; 86,6% dobra; 99,9%
        multiplica por 22). Mostra também os quatro trabalhos de 1905 e o que E = mc² significa em
        energia: 1 kg de matéria valeria cerca de 25 bilhões de kWh.</desc>
  <defs
     id="defs2">
    <linearGradient
       id="fundo"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#f2f0fb"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#ddd8f0"
         id="stop2" />
    </linearGradient>
    <marker
       id="e-5a4a95"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="10"
       markerHeight="10"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#5a4a95"
         id="path2" />
    </marker>
  </defs>
  <style
     id="style2">
        .cab  { fill:#2e2555; font-size:28px; font-weight:800; letter-spacing:1.2px; }
        .rot  { fill:#5a4a95; font-size:18px; font-weight:700; }
        .rotp { fill:#7d7499; font-size:14px; }
        .painel { fill:#ffffff; stroke:#c8c0e4; stroke-width:2; }
        .eq   { fill:#2e2555; font-size:26px; font-weight:800; }
        .num  { fill:#2e2555; font-size:17px; font-weight:700; }
        .ok   { fill:#2f8f5c; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#fundo)"
     id="rect2" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text2">O ANO EXTRAORDINÁRIO DE EINSTEIN — 1905</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text3">
        Um funcionário do escritório de patentes publicou, em um só ano, quatro trabalhos que viraram a física do avesso.
    </text>
  <!-- ══ Esquerda: a tabela do fator γ ══════════════════════════════════ -->
  <g
     transform="translate(46,112)"
     id="g25">
    <rect
       class="painel"
       x="0"
       y="0"
       width="812"
       height="380"
       rx="16"
       id="rect3" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text4">QUANTO MAIS RÁPIDO, MAIS DEVAGAR ANDA O RELÓGIO</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text5">γ = 1 ÷ √(1 − v²/c²) — o fator que estica o tempo</text>
    <!-- cabeçalho da tabela -->
    <g
       transform="translate(24,84)"
       id="g8">
      <rect
         x="0"
         y="0"
         width="764"
         height="34"
         rx="8"
         fill="#efecf9"
         stroke="#c8c0e4"
         id="rect5" />
      <text
         class="rotp"
         x="20"
         y="23"
         font-weight="700"
         id="text6">VELOCIDADE (fração de c)</text>
      <text
         class="rotp"
         x="300"
         y="23"
         font-weight="700"
         id="text7">γ</text>
      <text
         class="rotp"
         x="430"
         y="23"
         font-weight="700"
         id="text8">12 MESES NA TERRA VALEM, A BORDO…</text>
    </g>
    <!-- linhas -->
    <g
       transform="translate(24,124)"
       id="g24">
      <g
         id="g11">
        <rect
           x="0"
           y="0"
           width="764"
           height="38"
           rx="8"
           fill="#faf9fe"
           stroke="#e5e0f3"
           id="rect8" />
        <text
           class="num"
           x="20"
           y="25"
           id="text9">10% de c  (30.000 km/s)</text>
        <text
           class="num"
           x="300"
           y="25"
           id="text10">1,005</text>
        <text
           class="rotp"
           x="430"
           y="25"
           font-size="15"
           id="text11">11,9 meses — quase nada muda</text>
      </g>
      <g
         transform="translate(0,44)"
         id="g14">
        <rect
           x="0"
           y="0"
           width="764"
           height="38"
           rx="8"
           fill="#faf9fe"
           stroke="#e5e0f3"
           id="rect11" />
        <text
           class="num"
           x="20"
           y="25"
           id="text12">50% de c</text>
        <text
           class="num"
           x="300"
           y="25"
           id="text13">1,15</text>
        <text
           class="rotp"
           x="430"
           y="25"
           font-size="15"
           id="text14">10,4 meses</text>
      </g>
      <g
         transform="translate(0,88)"
         id="g17">
        <rect
           x="0"
           y="0"
           width="764"
           height="38"
           rx="8"
           fill="#e6f6ec"
           stroke="#2f8f5c"
           stroke-width="2"
           id="rect14" />
        <text
           class="num ok"
           x="20"
           y="25"
           id="text15">86,6% de c  ← o desafio do jogo</text>
        <text
           class="num ok"
           x="300"
           y="25"
           id="text16">2,00</text>
        <text
           class="rotp"
           x="430"
           y="25"
           font-size="15"
           style="fill:#2f8f5c"
           font-weight="700"
           id="text17">
                    6 meses — o tempo anda pela METADE
                </text>
      </g>
      <g
         transform="translate(0,132)"
         id="g20">
        <rect
           x="0"
           y="0"
           width="764"
           height="38"
           rx="8"
           fill="#faf9fe"
           stroke="#e5e0f3"
           id="rect17" />
        <text
           class="num"
           x="20"
           y="25"
           id="text18">99% de c</text>
        <text
           class="num"
           x="300"
           y="25"
           id="text19">7,1</text>
        <text
           class="rotp"
           x="430"
           y="25"
           font-size="15"
           id="text20">1,7 mês</text>
      </g>
      <g
         transform="translate(0,176)"
         id="g23">
        <rect
           x="0"
           y="0"
           width="764"
           height="38"
           rx="8"
           fill="#faf9fe"
           stroke="#e5e0f3"
           id="rect20" />
        <text
           class="num"
           x="20"
           y="25"
           id="text21">99,9% de c</text>
        <text
           class="num"
           x="300"
           y="25"
           id="text22">22,4</text>
        <text
           class="rotp"
           x="430"
           y="25"
           font-size="15"
           id="text23">16 dias — e nunca se alcança c</text>
      </g>
    </g>
  </g>
  <!-- ══ Direita: E = mc² ═══════════════════════════════════════════════ -->
  <g
     transform="translate(886,112)"
     id="g34">
    <rect
       class="painel"
       x="0"
       y="0"
       width="468"
       height="380"
       rx="16"
       id="rect25" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text25">E MASSA É ENERGIA GUARDADA</text>
    <g
       transform="translate(24,60)"
       id="g26">
      <rect
         x="0"
         y="0"
         width="420"
         height="70"
         rx="10"
         fill="#efecf9"
         stroke="#c8c0e4"
         stroke-width="1.5"
         id="rect26" />
      <text
         class="eq"
         x="210"
         y="45"
         text-anchor="middle"
         font-size="34"
         id="text26">E = mc²</text>
    </g>
    <g
       transform="translate(24,146)"
       id="g29">
      <rect
         x="0.045022942"
         y="0.045022942"
         width="419.90994"
         height="80.921219"
         rx="9.9978561"
         fill="#faf9fe"
         stroke="#e5e0f3"
         stroke-width="1.59005"
         id="rect27" />
      <text
         class="rot"
         x="20"
         y="30"
         font-size="16"
         id="text27">c = 299.792 km/s</text>
      <text
         class="rotp"
         x="20"
         y="54"
         id="text28">a luz dá 7 voltas na Terra em 1 segundo — e essa</text>
      <text
         class="rotp"
         x="20"
         y="70"
         font-size="13"
         id="text29">velocidade é a MESMA para quem quer que a meça.</text>
    </g>
    <path
       d="M234 226 V 244"
       stroke="#5a4a95"
       stroke-width="2.5"
       fill="none"
       marker-end="url(#e-5a4a95)"
       id="path29" />
    <g
       transform="translate(24,252)"
       id="g33">
      <rect
         x="0"
         y="0"
         width="420"
         height="104"
         rx="10"
         fill="#e6f6ec"
         stroke="#2f8f5c"
         stroke-width="2"
         id="rect29" />
      <text
         class="rot ok"
         x="20"
         y="32"
         font-size="16"
         id="text30">1 kg de matéria ≈ 25 bilhões de kWh</text>
      <text
         class="rotp"
         x="20"
         y="58"
         id="text31">Energia para uma cidade inteira — guardada num</text>
      <text
         class="rotp"
         x="20"
         y="76"
         id="text32">saco de açúcar. Na fissão do urânio, só 0,1% da</text>
      <text
         class="rotp"
         x="20"
         y="94"
         font-size="13"
         id="text33">massa vira energia — e já basta para uma usina.</text>
    </g>
  </g>
  <!-- ══ Rodapé: os quatro trabalhos de 1905 ════════════════════════════ -->
  <g
     transform="translate(46,520)"
     id="g51">
    <rect
       class="painel"
       x="0"
       y="0"
       width="1308"
       height="212"
       rx="16"
       id="rect34" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text34">OS QUATRO TRABALHOS DE UM ANO SÓ</text>
    <g
       transform="translate(30,60)"
       id="g38">
      <rect
         x="0"
         y="0"
         width="300"
         height="122"
         rx="12"
         fill="#faf9fe"
         stroke="#e5e0f3"
         stroke-width="1.5"
         id="rect35" />
      <text
         class="rot"
         x="18"
         y="30"
         font-size="15"
         id="text35">1 · Efeito fotoelétrico</text>
      <text
         class="rotp"
         x="18"
         y="56"
         font-size="13"
         id="text36">A luz também se comporta como</text>
      <text
         class="rotp"
         x="18"
         y="76"
         font-size="13"
         id="text37">grãos de energia. Deu-lhe o Nobel</text>
      <text
         class="rotp"
         x="18"
         y="96"
         font-size="13"
         id="text38">— e nasceu a física quântica.</text>
    </g>
    <g
       transform="translate(348,60)"
       id="g42">
      <rect
         x="0"
         y="0"
         width="300"
         height="122"
         rx="12"
         fill="#faf9fe"
         stroke="#e5e0f3"
         stroke-width="1.5"
         id="rect38" />
      <text
         class="rot"
         x="18"
         y="30"
         font-size="15"
         id="text39">2 · Movimento browniano</text>
      <text
         class="rotp"
         x="18"
         y="56"
         font-size="13"
         id="text40">O tremor de um grão de pólen na</text>
      <text
         class="rotp"
         x="18"
         y="76"
         font-size="13"
         id="text41">água provou que as moléculas</text>
      <text
         class="rotp"
         x="18"
         y="96"
         font-size="13"
         id="text42">existem mesmo — e se agitam.</text>
    </g>
    <g
       transform="translate(666,60)"
       id="g46">
      <rect
         x="0"
         y="0"
         width="300"
         height="122"
         rx="12"
         fill="#faf9fe"
         stroke="#e5e0f3"
         stroke-width="1.5"
         id="rect42" />
      <text
         class="rot"
         x="18"
         y="30"
         font-size="15"
         id="text43">3 · Relatividade especial</text>
      <text
         class="rotp"
         x="18"
         y="56"
         font-size="13"
         id="text44">O tempo não é o mesmo para todos:</text>
      <text
         class="rotp"
         x="18"
         y="76"
         font-size="13"
         id="text45">depende de quão rápido você anda.</text>
      <text
         class="rotp"
         x="18"
         y="96"
         font-size="13"
         id="text46">Hoje o GPS corrige isso todo dia.</text>
    </g>
    <g
       transform="translate(984,60)"
       id="g50">
      <rect
         x="0"
         y="0"
         width="300"
         height="122"
         rx="12"
         fill="#e6f6ec"
         stroke="#2f8f5c"
         stroke-width="2"
         id="rect46" />
      <text
         class="rot ok"
         x="18"
         y="30"
         font-size="15"
         id="text47">4 · E = mc²</text>
      <text
         class="rotp"
         x="18"
         y="56"
         font-size="13"
         id="text48">Massa e energia são a mesma coisa</text>
      <text
         class="rotp"
         x="18"
         y="76"
         font-size="13"
         id="text49">em duas formas. E, mesmo assim,</text>
      <text
         class="rotp"
         x="18"
         y="96"
         font-size="13"
         id="text50">só arranhamos &quot;as bordas&quot; (Jó 26:14).</text>
    </g>
  </g>
</svg>
