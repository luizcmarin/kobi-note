  <!-- ══ Rodapé: três chaves de leitura ═════════════════════════════════ -->
  <g
     transform="translate(46,420)"
     id="g68">
    <g
       id="g49">
      <rect
         class="painel"
         width="422"
         height="336"
         rx="16"
         id="rect40" />
      <text
         class="rot"
         x="24"
         y="42"
         id="text41">“NO PRINCÍPIO” É À PARTE</text>
      <text
         class="rotp"
         x="24"
         y="76"
         font-size="15"
         id="text42">Gênesis 1:1 descreve a criação dos</text>
      <text
         class="rotp"
         x="24"
         y="98"
         font-size="15"
         id="text43">céus e da Terra ANTES dos dias</text>
      <text
         class="rotp"
         x="24"
         y="120"
         font-size="15"
         id="text44">criativos (que começam no v. 3).</text>
      <text
         class="rotp"
         x="24"
         y="156"
         font-size="15"
         id="text45">Então a Bíblia não fixa a idade do</text>
      <text
         class="rotp"
         x="24"
         y="178"
         font-size="15"
         id="text46">Universo — e não contradiz os</text>
      <text
         class="rotp"
         x="24"
         y="200"
         font-size="15"
         id="text47">~4 bilhões de anos da Terra nem os</text>
      <text
         class="rotp"
         x="24"
         y="222"
         font-size="15"
         id="text48">~15 bilhões do cosmo.</text>
      <text
         class="ok"
         x="24"
         y="286"
         font-size="17"
         font-weight="800"
         id="text49">A ciência não contradiz o texto.</text>
    </g>
    <g
       transform="translate(443,0)"
       id="g57">
      <rect
         class="painel"
         width="422"
         height="336"
         rx="16"
         id="rect49" />
      <text
         class="rot"
         x="24"
         y="42"
         id="text50">“DIA” = LONGO PERÍODO</text>
      <text
         class="rotp"
         x="24"
         y="76"
         font-size="15"
         id="text51">A palavra hebraica traduzida “dia”</text>
      <text
         class="rotp"
         x="24"
         y="98"
         font-size="15"
         id="text52">pode significar vários períodos, não</text>
      <text
         class="rotp"
         x="24"
         y="120"
         font-size="15"
         id="text53">apenas 24 horas.</text>
      <text
         class="rotp"
         x="24"
         y="156"
         font-size="15"
         id="text54">O próprio Gênesis 2:4 chama os seis</text>
      <text
         class="rotp"
         x="24"
         y="178"
         font-size="15"
         id="text55">dias, juntos, de “um dia”. A</text>
      <text
         class="rotp"
         x="24"
         y="200"
         font-size="15"
         id="text56">fraseologia indica longos períodos.</text>
      <text
         class="ok"
         x="24"
         y="286"
         font-size="17"
         font-weight="800"
         id="text57">Dias que são eras.</text>
    </g>
    <g
       transform="translate(886,0)"
       id="g67">
      <rect
         class="painel"
         width="422"
         height="336"
         rx="16"
         fill="#eef6f0"
         stroke="#a9dcc0"
         id="rect57" />
      <text
         class="rot ok"
         x="24"
         y="42"
         id="text58">O SOL NO 4º DIA?</text>
      <text
         class="rotp"
         x="24"
         y="76"
         font-size="15"
         id="text59">A luz difusa já atravessava a</text>
      <text
         class="rotp"
         x="24"
         y="98"
         font-size="15"
         id="text60">atmosfera no 1º dia. O Sol já existia,</text>
      <text
         class="rotp"
         x="24"
         y="120"
         font-size="15"
         id="text61">mas só ficou VISÍVEL da superfície no</text>
      <text
         class="rotp"
         x="24"
         y="142"
         font-size="15"
         id="text62">4º dia, quando o céu carregado clareou.</text>
      <text
         class="rotp"
         x="24"
         y="178"
         font-size="15"
         font-style="italic"
         id="text63">Moisés escreveu do ponto de vista de</text>
      <text
         class="rotp"
         x="24"
         y="200"
         font-size="15"
         font-style="italic"
         id="text64">alguém na Terra — não do espaço.</text>
      <text
         class="rotp"
         x="24"
         y="252"
         font-size="15"
         id="text65">“No princípio Deus criou os céus</text>
      <text
         class="rotp"
         x="24"
         y="274"
         font-size="15"
         id="text66">e a terra.” — Gênesis 1:1</text>
      <text
         class="ok"
         x="24"
         y="312"
         font-size="17"
         font-weight="800"
         id="text67">Isso teve um Projeto?</text>
    </g>
  </g>
</svg>
