  <title
     id="tit">A Linha do Tempo da Criação — os oito estágios de Gênesis 1</title>
  <desc
     id="desc">O jogo pede ordenar os estágios; esta ilustração mostra a sequência de Gênesis 1
        e as duas chaves que a harmonizam com a ciência: &quot;No princípio&quot; (Gênesis 1:1) é um evento à
        parte, então o Universo já existia antes dos dias; e os &quot;dias&quot; são longos períodos, não de 24
        horas. O Sol já existia, mas só ficou visível da superfície no 4º dia, quando o céu clareou.</desc>
  <defs
     id="defs5">
    <linearGradient
       id="fundo"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#eef2fb"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#dde3f3"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="ceu"
       x1="0"
       y1="0"
       x2="1"
       y2="0">
      <stop
         offset="0"
         stop-color="#1a2340"
         id="stop3" />
      <stop
         offset="0.5"
         stop-color="#3f5a8c"
         id="stop4" />
      <stop
         offset="1"
         stop-color="#8fb8e6"
         id="stop5" />
    </linearGradient>
  </defs>
  <style
