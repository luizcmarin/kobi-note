  <text
     class="cab"
     x="46"
     y="54"
     id="text5">A LINHA DO TEMPO DA CRIAÇÃO</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text6">
        Gênesis 1 descreve a formação da Terra numa ordem — e a ordem combina com o que a ciência hoje descreve.
    </text>
