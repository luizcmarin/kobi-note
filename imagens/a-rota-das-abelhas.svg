  <!-- ══ Rodapé ═════════════════════════════════════════════════════════ -->
  <g
     transform="translate(46,520)"
     id="g48">
    <rect
       class="painel"
       x="0"
       y="0"
       width="1308"
       height="212"
       rx="16"
       id="rect35" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text35">ENTÃO COMO É QUE ELA ACHA?</text>
    <g
       transform="translate(30,64)"
       id="g39">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#fdf8e6"
         stroke="#d9c184"
         stroke-width="1.5"
         id="rect36" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text36">Ela não calcula. Ela tenta.</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text37">Nas primeiras viagens a abelha voa numa ordem</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text38">meio torta. A cada volta, ela troca duas flores de</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text39">lugar e guarda a versão que gastou menos voo.</text>
    </g>
    <g
       transform="translate(452,64)"
       id="g43">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#f4faef"
         stroke="#2f8f3d"
         stroke-width="2"
         id="rect39" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#2f8f3d"
         id="text40">Em poucas viagens, chega perto do ótimo</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text41">Não é a resposta perfeita — é uma resposta</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text42">quase perfeita, achada depressa. É exatamente</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text43">assim que a computação aprendeu a atacar isso.</text>
    </g>
    <g
       transform="translate(874,64)"
       id="g47">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#fdf3d4"
         stroke="#c9701e"
         stroke-width="2"
         id="rect43" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#c9701e"
         id="text44">E se aparecer uma flor nova?</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text45">O computador teria de refazer a conta toda.</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text46">A abelha só encaixa a flor nova na volta e segue</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text47">ajustando — sem parar de trabalhar.</text>
    </g>
