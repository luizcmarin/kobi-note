<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 1400 800"
   width="1400"
   height="800"
   role="img"
   aria-labelledby="tit desc"
   font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
   version="1.1"
   id="svg47"
   sodipodi:docname="a-inclinacao-da-terra.svg"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview47"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#505050"
     inkscape:zoom="0.99875"
     inkscape:cx="700.37547"
     inkscape:cy="400"
     inkscape:window-width="1920"
     inkscape:window-height="1008"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg47" />
  <title
     id="tit">A Inclinação da Terra — 23,5° que criam as estações</title>
  <desc
     id="desc">O eixo da Terra é inclinado 23,5°. Ao longo da órbita, ora um hemisfério recebe a luz
        do Sol mais de frente (verão), ora o outro (inverno) — e o mesmo lugar passa por primavera e
        outono no meio do caminho. Sem inclinação não haveria estações; com inclinação demais, o clima
        viraria extremo.</desc>
  <defs
     id="defs10">
    <radialGradient
       id="espaco"
       cx="0.5"
       cy="0.4"
       r="0.75">
      <stop
         offset="0"
         stop-color="#16305a"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#070f23"
         id="stop2" />
    </radialGradient>
    <radialGradient
       id="solG"
       cx="0.5"
       cy="0.5"
       r="0.5">
      <stop
         offset="0"
         stop-color="#fffbe8"
         id="stop3" />
      <stop
         offset="0.4"
         stop-color="#ffd166"
         stop-opacity="0.95"
         id="stop4" />
      <stop
         offset="1"
         stop-color="#ff9d3c"
         stop-opacity="0"
         id="stop5" />
    </radialGradient>
    <linearGradient
       id="terraG"
       x1="0.2"
       y1="0"
       x2="0.8"
       y2="1">
      <stop
         offset="0"
         stop-color="#4aa8f5"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#14508c"
         id="stop7" />
    </linearGradient>
    <!-- A Terra com o eixo inclinado (o eixo aponta sempre para o MESMO lado) -->
    <g
       id="terra">
      <circle
         cx="0"
         cy="0"
         r="46"
         fill="url(#terraG)"
         id="circle7" />
      <path
         d="M-40 -18 C -20 -26, 0 -10, 22 -20 C 34 -26, 42 -18, 44 -12                      C 30 -4, 10 4, -12 0 C -26 -2, -34 -8, -40 -18 Z"
         fill="#4ec07a"
         opacity="0.85"
         id="path7" />
      <path
         d="M-30 22 C -12 14, 10 22, 30 16"
         stroke="#4ec07a"
         stroke-width="8"
         fill="none"
         opacity="0.8"
         stroke-linecap="round"
         id="path8" />
      <!-- eixo: 23,5° fora da vertical -->
      <g
         transform="rotate(23.5)"
         id="g10">
        <path
           d="M0 -70 L 0 70"
           stroke="#ffd166"
           stroke-width="3"
           id="path9" />
        <circle
           cx="0"
           cy="-70"
           r="4"
           fill="#ffd166"
           id="circle9" />
        <circle
           cx="0"
           cy="70"
           r="4"
           fill="#ffd166"
           id="circle10" />
      </g>
    </g>
    <marker
       id="s-ffd166"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="11"
       markerHeight="11"
       markerUnits="userSpaceOnUse"
       orient="auto">
      <path
         d="M0 0 L10 5 L0 10 z"
         fill="#ffd166"
         id="path10" />
    </marker>
  </defs>
  <style
     id="style10">
        .cab  { fill:#eaf2ff; font-size:28px; font-weight:800; letter-spacing:1.2px; }
        .rot  { fill:#dce8ff; font-size:18px; font-weight:700; }
        .rotp { fill:#93aacd; font-size:14px; }
        .painel { fill:#10203f; stroke:#3a5c92; stroke-width:2; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#espaco)"
     id="rect10" />
  <g
     fill="#ffffff"
     opacity="0.55"
     id="g20">
    <circle
       cx="120"
       cy="150"
       r="1.6"
       id="circle11" />
    <circle
       cx="300"
       cy="90"
       r="1.2"
       id="circle12" />
    <circle
       cx="520"
       cy="130"
       r="1.6"
       id="circle13" />
    <circle
       cx="760"
       cy="70"
       r="1.2"
       id="circle14" />
    <circle
       cx="980"
       cy="140"
       r="1.6"
       id="circle15" />
    <circle
       cx="1180"
       cy="90"
       r="1.2"
       id="circle16" />
    <circle
       cx="180"
       cy="700"
       r="1.4"
       id="circle17" />
    <circle
       cx="640"
       cy="740"
       r="1.2"
       id="circle18" />
    <circle
       cx="1290"
       cy="690"
       r="1.6"
       id="circle19" />
    <circle
       cx="60"
       cy="420"
       r="1.2"
       id="circle20" />
  </g>
  <text
     class="cab"
     x="46"
     y="54"
     id="text20">A INCLINAÇÃO DA TERRA</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text21">23,5° — o ângulo que reparte o ano em estações.</text>
  <!-- ══ A órbita ═══════════════════════════════════════════════════════ -->
  <ellipse
     cx="640"
     cy="470"
     rx="440"
     ry="200"
     fill="none"
     stroke="#3a5c92"
     stroke-width="2"
     stroke-dasharray="10 9"
     id="ellipse21" />
  <!-- O Sol, no centro -->
  <circle
     cx="640"
     cy="470"
     r="130"
     fill="url(#solG)"
     id="circle21" />
  <circle
     cx="640"
     cy="470"
     r="46"
     fill="#fff3c4"
     id="circle22" />
  <text
     class="rot"
     x="640"
     y="478"
     text-anchor="middle"
     style="fill:#8a5a12"
     id="text22">SOL</text>
  <!-- ══ Quatro posições da órbita: o eixo aponta SEMPRE para o mesmo lado ══ -->
  <!-- Esquerda: verão no hemisfério NORTE (o polo norte pende para o Sol) -->
  <g
     transform="translate(200,470)"
     id="g25">
    <use
       href="#terra"
       id="use22" />
    <text
       class="rot"
       x="0"
       y="-96"
       text-anchor="middle"
       font-size="16"
       style="fill:#ffd166"
       id="text23">VERÃO NO NORTE</text>
    <text
       class="rotp"
       x="0"
       y="112"
       text-anchor="middle"
       id="text24">o norte pende PARA o Sol</text>
    <text
       class="rotp"
       x="0"
       y="132"
       text-anchor="middle"
       id="text25">luz mais de frente, dias longos</text>
  </g>
  <!-- Direita: verão no hemisfério SUL -->
  <g
     transform="translate(1080,470)"
     id="g28">
    <use
       href="#terra"
       id="use25" />
    <text
       class="rot"
       x="0"
       y="-96"
       text-anchor="middle"
       font-size="16"
       style="fill:#ffd166"
       id="text26">VERÃO NO SUL</text>
    <text
       class="rotp"
       x="0"
       y="112"
       text-anchor="middle"
       id="text27">o norte pende PARA LONGE do Sol</text>
    <text
       class="rotp"
       x="0"
       y="132"
       text-anchor="middle"
       id="text28">luz de raspão, dias curtos</text>
  </g>
  <!-- Topo e base: os meios-termos -->
  <g
     transform="translate(640,278)"
     id="g29">
    <use
       href="#terra"
       transform="scale(0.8)"
       id="use28" />
    <text
       class="rotp"
       x="0"
       y="-58"
       text-anchor="middle"
       id="text29">meio do caminho: primavera / outono</text>
  </g>
  <g
     transform="translate(640,662)"
     id="g30">
    <use
       href="#terra"
       transform="scale(0.8)"
       id="use29" />
    <text
       class="rotp"
       x="0"
       y="72"
       text-anchor="middle"
       id="text30">meio do caminho: outono / primavera</text>
  </g>
  <!-- Raios do Sol chegando às duas Terras extremas -->
  <g
     stroke="#ffd166"
     stroke-width="2"
     opacity="0.75"
     id="g35">
    <path
       d="M540 440 L 268 440"
       marker-end="url(#s-ffd166)"
       id="path30" />
    <path
       d="M540 470 L 268 470"
       marker-end="url(#s-ffd166)"
       id="path31" />
    <path
       d="M540 500 L 268 500"
       marker-end="url(#s-ffd166)"
       id="path32" />
    <path
       d="M740 440 L 1012 440"
       marker-end="url(#s-ffd166)"
       id="path33" />
    <path
       d="M740 470 L 1012 470"
       marker-end="url(#s-ffd166)"
       id="path34" />
    <path
       d="M740 500 L 1012 500"
       marker-end="url(#s-ffd166)"
       id="path35" />
  </g>
  <!-- ══ Painel: o ângulo importa ═══════════════════════════════════════ -->
  <g
     transform="translate(46,120)"
     id="g40">
    <rect
       class="painel"
       x="0"
       y="0"
       width="300"
       height="230"
       rx="14"
       id="rect35" />
    <text
       class="rot"
       x="20"
       y="36"
       font-size="17"
       id="text35">O ÂNGULO CERTO</text>
    <!-- o ângulo, medido -->
    <g
       transform="translate(150,120)"
       id="g39">
      <path
         d="M0 60 L 0 -46"
         stroke="#3a5c92"
         stroke-width="2"
         stroke-dasharray="6 5"
         id="path36" />
      <path
         d="M0 60 L -42 -36"
         stroke="#ffd166"
         stroke-width="3"
         id="path37" />
      <path
         d="M0 -20 A 20 20 0 0 0 -9 -18"
         fill="none"
         stroke="#ffd166"
         stroke-width="2"
         id="path38" />
      <text
         class="rotp"
         x="10"
         y="-24"
         style="fill:#ffd166"
         font-size="15"
         font-weight="700"
         id="text38">23,5°</text>
      <text
         class="rotp"
         x="8"
         y="54"
         font-size="12"
         id="text39">vertical</text>
    </g>
    <text
       class="rotp"
       x="16"
       y="196"
       id="text40">0° → sem estações. Muito → clima extremo.</text>
  </g>
  <!-- ══ Painel: por que o eixo não "acompanha" o Sol ═══════════════════ -->
  <g
     transform="translate(1054,120)"
     id="g47">
    <rect
       class="painel"
       x="0"
       y="0"
       width="300"
       height="230"
       rx="14"
       id="rect40" />
    <text
       class="rot"
       x="20"
       y="36"
       font-size="17"
       id="text41">O EIXO NÃO GIRA</text>
    <text
       class="rotp"
       x="20"
       y="62"
       font-size="13"
       id="text42">aponta sempre para o mesmo ponto do céu</text>
    <g
       transform="translate(150,150)"
       id="g46">
      <g
         stroke="#ffd166"
         stroke-width="3"
         id="g45">
        <path
           d="M-96 34 L -96 -34"
           transform="rotate(23.5 -96 0)"
           id="path42" />
        <path
           d="M-32 34 L -32 -34"
           transform="rotate(23.5 -32 0)"
           id="path43" />
        <path
           d="M32 34 L 32 -34"
           transform="rotate(23.5 32 0)"
           id="path44" />
        <path
           d="M96 34 L 96 -34"
           transform="rotate(23.5 96 0)"
           id="path45" />
      </g>
      <text
         class="rotp"
         x="0"
         y="66"
         text-anchor="middle"
         font-size="13"
         id="text45">
                por isso a estação muda ao longo da volta
            </text>
    </g>
  </g>
  <text
     class="rotp"
     x="700"
     y="775"
     text-anchor="middle"
     font-size="15"
     id="text47">
        A mesma inclinação, a volta inteira: é a posição na órbita que decide quem recebe a luz de frente.
    </text>
</svg>
