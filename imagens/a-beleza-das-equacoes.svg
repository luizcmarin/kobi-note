    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#fundo)"
     id="rect5" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text5">A BELEZA DAS EQUAÇÕES</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text6">O sinal de igual não é &quot;a resposta vem aí&quot;. É o fiel de uma balança.</text>
  <!-- ══ Esquerda: a balança pendendo e nivelando ═══════════════════════ -->
  <g
     transform="translate(46,112)"
     id="g35">
    <rect
       class="painel"
