       y="0"
       width="812"
       height="380"
       rx="16"
       id="rect6" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text7">2x + 3 = 11 — QUAL x NIVELA OS PRATOS?</text>
    <!-- x = 2: pende para a direita -->
    <g
       transform="translate(150,180)"
       id="g16">
      <text
         class="rot"
         x="0"
         y="-58"
         text-anchor="middle"
         font-size="16"
         style="fill:#c0392b"
         id="text8">x = 2</text>
      <!-- coluna -->
      <path
         d="M0 -30 V 92"
         stroke="#8a75b8"
         stroke-width="8"
         id="path8" />
      <path
         d="M-30 92 H 30 L 22 106 H -22 Z"
         fill="url(#metal)"
         id="path9" />
      <!-- braço inclinado (direita pesa mais) -->
      <g
         transform="rotate(9)"
         id="g15">
        <path
           d="M-86 -30 H 86"
           stroke="#8a75b8"
           stroke-width="7"
           stroke-linecap="round"
           id="path10" />
        <path
           d="M-86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path11" />
        <path
           d="M86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path12" />
        <path
           d="M-116 2 H -56 L -64 28 H -108 Z"
           fill="#efeaf9"
           stroke="#8a75b8"
           stroke-width="2"
           id="path13" />
        <path
           d="M56 2 H 116 L 108 28 H 64 Z"
           fill="#efeaf9"
           stroke="#8a75b8"
           stroke-width="2"
           id="path14" />
        <!-- 2·2 + 3 = 7, contra 11 -->
        <text
           class="rot"
           x="-86"
           y="22"
           text-anchor="middle"
           font-size="16"
           id="text14">7</text>
        <text
           class="rot"
           x="86"
           y="22"
           text-anchor="middle"
           font-size="16"
           id="text15">11</text>
      </g>
      <text
         class="rotp"
         x="0"
         y="132"
         text-anchor="middle"
         style="fill:#c0392b"
         id="text16">falta peso à esquerda</text>
    </g>
    <!-- x = 4: nivelada -->
    <g
       transform="translate(406,180)"
       id="g25">
      <text
         class="rot"
         x="0"
         y="-58"
         text-anchor="middle"
         font-size="16"
