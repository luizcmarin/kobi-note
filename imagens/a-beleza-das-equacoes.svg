       rx="16"
       id="rect35" />
    <text
       class="rot"
       x="24"
       y="38"
       style="fill:#2f8f5c"
       id="text36">A ÚNICA REGRA QUE EXISTE</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text37">o que você faz de um lado, faça do outro</text>
    <g
       transform="translate(24,86)"
       id="g39">
      <rect
         x="0"
         y="0"
         width="420"
         height="80"
         rx="10"
         fill="#f7f4fd"
         stroke="#c3b7e0"
         stroke-width="1.5"
         id="rect37" />
      <text
         class="eq"
         x="210"
         y="36"
         text-anchor="middle"
         id="text38">2x + 3 = 11</text>
      <text
         class="rotp"
         x="210"
         y="64"
         text-anchor="middle"
         font-size="15"
         id="text39">a balança de partida</text>
    </g>
    <path
       d="M234 176 V 196"
       stroke="#6a5a92"
       stroke-width="2.5"
       fill="none"
       marker-end="url(#s-6a5a92)"
       id="path39" />
    <text
       class="rotp"
       x="252"
       y="193"
       font-size="15"
       font-weight="700"
       id="text40">tire 3 dos DOIS pratos</text>
    <g
       transform="translate(24,204)"
       id="g42">
      <rect
         x="0"
         y="0"
         width="420"
         height="80"
         rx="10"
         fill="#f7f4fd"
         stroke="#c3b7e0"
         stroke-width="1.5"
         id="rect40" />
      <text
         class="eq"
         x="210"
         y="36"
         text-anchor="middle"
         id="text41">2x = 8</text>
      <text
         class="rotp"
         x="210"
         y="64"
         text-anchor="middle"
         font-size="15"
         id="text42">continua nivelada</text>
    </g>
    <path
       d="M234 294 V 312"
       stroke="#2f8f5c"
       stroke-width="2.5"
       fill="none"
       marker-end="url(#s-2f8f5c)"
       id="path42" />
    <text
       class="rotp"
       x="252"
       y="309"
       font-size="15"
       font-weight="700"
       style="fill:#2f8f5c"
       id="text43">divida os DOIS por 2</text>
    <g
       transform="translate(24,318)"
       id="g44">
      <rect
         x="0"
         y="0"
         width="420"
         height="46"
         rx="10"
         fill="#e6f6ec"
         stroke="#2f8f5c"
         stroke-width="2"
         id="rect43" />
      <text
         class="eq"
         x="210"
         y="33"
         text-anchor="middle"
         style="fill:#2f8f5c"
         id="text44">x = 4</text>
    </g>
  </g>
  <!-- ══ Rodapé ═════════════════════════════════════════════════════════ -->
  <g
     transform="translate(46,520)"
     id="g58">
    <rect
       class="painel"
       x="0"
       y="0"
       width="1308"
       height="212"
       rx="16"
       id="rect45" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text45">E É POR ISSO QUE OS MATEMÁTICOS FALAM EM &quot;BELEZA&quot;</text>
    <g
       transform="translate(30,64)"
       id="g49">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#f7f4fd"
         stroke="#c3b7e0"
         stroke-width="1.5"
         id="rect46" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text46">Uma regra só, para tudo</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text47">Some, subtraia, multiplique, divida — desde que</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text48">faça nos dois lados, a igualdade se mantém. É a</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text49">mesma regra da primeira série à física quântica.</text>
    </g>
    <g
       transform="translate(452,64)"
       id="g53">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#f7f4fd"
         stroke="#c3b7e0"
         stroke-width="1.5"
         id="rect49" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         id="text50">A equação diz mais do que parece</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text51">&quot;2x + 3 = 11&quot; não é um pedido de conta. É uma</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text52">afirmação sobre o mundo: existe um x, e um só,</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text53">que faz esses dois lados serem a mesma coisa.</text>
    </g>
    <g
       transform="translate(874,64)"
       id="g57">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#e6f6ec"
         stroke="#2f8f5c"
         stroke-width="2"
         id="rect53" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#2f8f5c"
         id="text54">O universo obedece a equações</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text55">A queda de uma pedra, a órbita de um planeta e a</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text56">luz de uma estrela seguem igualdades que cabem</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text57">numa linha. Isso não tinha de ser assim — mas é.</text>
    </g>
  </g>
  <text
     class="rotp"
     x="46"
     y="768"
     font-size="15"
     id="text58"
     style="font-size:14.6667px">&quot;O mais incompreensível a respeito do universo é que ele seja compreensível.&quot; — e é em equações que ele se deixa compreender.</text>
</svg>
