         id="text17">x = 4</text>
      <path
         d="M0 -30 V 92"
         stroke="#8a75b8"
         stroke-width="8"
         id="path17" />
      <path
         d="M-30 92 H 30 L 22 106 H -22 Z"
         fill="url(#metal)"
         id="path18" />
      <g
         id="g24">
        <path
           d="M-86 -30 H 86"
           stroke="#2f8f5c"
           stroke-width="7"
           stroke-linecap="round"
           id="path19" />
        <path
           d="M-86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path20" />
        <path
           d="M86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path21" />
        <path
           d="M-116 2 H -56 L -64 28 H -108 Z"
           fill="#e6f6ec"
           stroke="#2f8f5c"
           stroke-width="2"
           id="path22" />
        <path
           d="M56 2 H 116 L 108 28 H 64 Z"
           fill="#e6f6ec"
           stroke="#2f8f5c"
           stroke-width="2"
           id="path23" />
        <text
           class="rot"
           x="-86"
           y="22"
           text-anchor="middle"
           font-size="16"
           style="fill:#2f8f5c"
           id="text23">11</text>
        <text
           class="rot"
           x="86"
           y="22"
           text-anchor="middle"
           font-size="16"
           style="fill:#2f8f5c"
           id="text24">11</text>
      </g>
      <circle
         cx="0"
         cy="-30"
         r="7"
         fill="#2f8f5c"
         id="circle24" />
      <text
         class="rotp"
         x="0"
         y="132"
         text-anchor="middle"
         style="fill:#2f8f5c"
         font-weight="700"
         id="text25">
                nivelou: é este o x
            </text>
    </g>
    <!-- x = 6: pende para a esquerda -->
    <g
       transform="translate(662,180)"
       id="g34">
      <text
         class="rot"
         x="0"
         y="-58"
         text-anchor="middle"
         font-size="16"
         style="fill:#c0392b"
         id="text26">x = 6</text>
      <path
         d="M0 -30 V 92"
         stroke="#8a75b8"
         stroke-width="8"
         id="path26" />
      <path
         d="M-30 92 H 30 L 22 106 H -22 Z"
         fill="url(#metal)"
         id="path27" />
      <g
         transform="rotate(-9)"
         id="g33">
        <path
           d="M-86 -30 H 86"
           stroke="#8a75b8"
           stroke-width="7"
           stroke-linecap="round"
           id="path28" />
        <path
           d="M-86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path29" />
        <path
           d="M86 -30 V 2"
           stroke="#8a75b8"
           stroke-width="2"
           id="path30" />
        <path
           d="M-116 2 H -56 L -64 28 H -108 Z"
           fill="#efeaf9"
           stroke="#8a75b8"
           stroke-width="2"
           id="path31" />
        <path
           d="M56 2 H 116 L 108 28 H 64 Z"
           fill="#efeaf9"
           stroke="#8a75b8"
           stroke-width="2"
           id="path32" />
        <text
           class="rot"
           x="-86"
           y="22"
           text-anchor="middle"
           font-size="16"
           id="text32">15</text>
        <text
           class="rot"
           x="86"
           y="22"
           text-anchor="middle"
           font-size="16"
           id="text33">11</text>
      </g>
      <text
         class="rotp"
         x="0"
         y="132"
         text-anchor="middle"
         style="fill:#c0392b"
         id="text34">agora sobra</text>
    </g>
    <text
       class="rotp"
       x="24"
       y="348"
       font-size="15"
       id="text35">
            Resolver não é &quot;achar a resposta&quot;. É procurar o valor que deixa os dois lados com o mesmo peso.
        </text>
  </g>
  <!-- ══ Direita: a regra de ouro ═══════════════════════════════════════ -->
  <g
     transform="translate(886,112)"
     id="g45">
    <rect
       class="painel"
       x="0"
       y="0"
       width="468"
