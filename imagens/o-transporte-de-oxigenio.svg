      <text
         class="rotp"
         x="18"
         y="28"
         id="text29">O primeiro oxigênio entra com dificuldade.</text>
      <text
         class="rotp"
         x="18"
         y="52"
         id="text30">Ao entrar, ele <tspan
   font-weight="700"
   style="fill:#7bd389"
   id="tspan29">abre a molécula</tspan> — e os três</text>
      <text
         class="rotp"
