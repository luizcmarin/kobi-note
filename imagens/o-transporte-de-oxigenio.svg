  <text
     class="cab"
     x="46"
     y="54"
     id="text3">O TRANSPORTE DE OXIGÊNIO</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text4">Agarrar é fácil. Agarrar com força suficiente para carregar — e fraca o bastante para soltar — é que é o problema.</text>
  <!-- ══ Esquerda: a curva em S ═════════════════════════════════════════ -->
