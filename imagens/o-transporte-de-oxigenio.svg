         y="26"
         style="fill:#63c7e8"
         id="text17">enche: quase 100%</text>
      <circle
         cx="170"
         cy="158"
         r="7"
         fill="#e07a2f"
         id="circle17" />
      <text
         class="rotp"
         x="182"
         y="176"
         style="fill:#e07a2f"
         id="text18">solta: cai para uns 30%</text>
