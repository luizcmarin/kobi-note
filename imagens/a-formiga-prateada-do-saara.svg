         x="60"
         y="0"
         width="700"
         height="52"
         rx="8"
         fill="#8a6a3a"
         stroke="#5f4826"
         stroke-width="2"
         id="rect28" />
      <text
         class="rotp"
         x="80"
         y="32"
         style="font-size:14.6667px;fill:#ffe6bd"
         id="text28">o corpo da formiga</text>
      <path
         d="M226 -22 L 226 -2"
         stroke="#8e6f42"
         stroke-width="1.5"
         fill="none"
