       y="182"
       text-anchor="middle"
       font-weight="700"
       style="fill:#c07d20"
       id="text16">o Sol a pino</text>
    <!-- 1) a luz que chega e é devolvida -->
    <g
       stroke="#f5b13c"
       stroke-width="3"
       fill="none"
       id="g17">
