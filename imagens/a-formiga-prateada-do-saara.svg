           id="text37">56 °C</text>
        <text
           class="rotp"
           x="0"
           y="332"
           text-anchor="middle"
           id="text38">só refletindo</text>
        <text
           class="rotp"
           x="0"
           y="352"
           text-anchor="middle"
           style="fill:#c06a1f"
           id="text39">ainda morre</text>
      </g>
      <!-- reflete e irradia: 49 -->
      <g
         transform="translate(384,0)"
         id="g42">
        <rect
           x="-26"
           y="256"
           width="52"
           height="54"
           rx="8"
           fill="#2f8f5c"
           id="rect39" />
        <text
           class="rot"
           x="0"
           y="290"
           text-anchor="middle"
           font-size="16"
           style="fill:#eafaf0"
           id="text40">49 °C</text>
        <text
           class="rotp"
           x="0"
           y="332"
           text-anchor="middle"
           id="text41">refletindo</text>
        <text
           class="rotp"
           x="0"
           y="352"
           text-anchor="middle"
           style="fill:#1f7a3d"
           id="text42">e irradiando: vive</text>
      </g>
    </g>
  </g>
  <!-- ══ Rodapé: as duas funções ════════════════════════════════════════ -->
  <g
     transform="translate(46,520)"
     id="g57">
    <rect
       class="painel"
       x="0"
       y="0"
       width="1308"
       height="212"
       rx="16"
       id="rect44" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text44">A MESMA &quot;ARMADURA&quot; FAZ DUAS COISAS OPOSTAS</text>
    <g
       transform="translate(30,64)"
       id="g48">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#fdf1dc"
         stroke="#e8942e"
         stroke-width="1.5"
         id="rect45" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#c06a1f"
         id="text45">1 · Devolve o calor que vem de fora</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text46">os dois lados de cima refletem a luz visível</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text47">e o infravermelho próximo — de onde vem</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text48">quase todo o calor do Sol</text>
    </g>
    <g
       transform="translate(452,64)"
       id="g52">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#e9f2f9"
         stroke="#4a90c4"
         stroke-width="1.5"
         id="rect48" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#2f6f9e"
         id="text49">2 · Joga fora o calor que vem de dentro</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text50">a base, colada no corpo, deixa o calor</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text51">interno escapar como infravermelho médio,</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text52">direto para o céu aberto</text>
    </g>
    <g
       transform="translate(874,64)"
       id="g56">
      <rect
         x="0"
         y="0"
         width="404"
         height="118"
         rx="12"
         fill="#eef7f0"
         stroke="#2f8f5c"
         stroke-width="2"
         id="rect52" />
      <text
         class="rot"
         x="20"
         y="32"
         font-size="16"
         style="fill:#1f7a3d"
         id="text53">E por que se arriscar assim?</text>
      <text
         class="rotp"
         x="20"
         y="60"
         id="text54">porque no auge do calor os predadores</text>
      <text
         class="rotp"
         x="20"
         y="84"
         id="text55">estão todos escondidos. Ela sai, cata os</text>
      <text
         class="rotp"
         x="20"
         y="104"
         id="text56">insetos que o sol matou, e volta correndo.</text>
    </g>
  </g>
  <text
     class="rotp"
     x="46"
     y="768"
     font-size="15"
     id="text57">
        Ela corre quase 1 metro por segundo — cem vezes o próprio corpo a cada segundo — e fica menos de dez minutos fora do ninho.
    </text>
</svg>
