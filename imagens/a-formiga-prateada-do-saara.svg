       cx="96"
       cy="112"
       r="26"
       fill="#f5b13c"
       id="circle15" />
    <g
       stroke="#f5b13c"
       stroke-width="2.5"
       id="g15">
      <path
         d="M96 74 V 62 M96 150 V 162 M58 112 H 46 M134 112 H 146                      M69 85 L 61 77 M123 139 L 131 147 M123 85 L 131 77 M69 139 L 61 147"
