       x="608"
       y="88"
       font-size="16"
       style="fill:#2f6f9e"
       id="text21">O CALOR SAI</text>
    <text
       class="rotp"
       x="608"
       y="110"
       style="fill:#2f6f9e"
       id="text22">o corpo irradia para o céu</text>
    <!-- a fileira de pelos triangulares sobre a cutícula -->
    <g
       transform="translate(0,244)"
