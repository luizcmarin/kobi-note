        .rot  { fill:#6b4c1e; font-size:18px; font-weight:700; }
        .rotp { fill:#8e6f42; font-size:14px; }
        .painel { fill:#fffaf0; stroke:#c9a469; stroke-width:2; }
    </style>
  <rect
     width="1400"
     height="800"
     fill="url(#ceu)"
     id="rect12" />
  <text
     class="cab"
     x="46"
     y="54"
     id="text12">A FORMIGA PRATEADA DO SAARA</text>
  <text
     class="rotp"
     x="46"
     y="84"
     font-size="17"
     id="text13">Ela sai para caçar na hora em que a areia passa de 60 °C — e o corpo dela morre aos 53 °C.</text>
  <!-- ══ Esquerda: o pelo, em corte ═════════════════════════════════════ -->
  <g
     transform="translate(46,112)"
