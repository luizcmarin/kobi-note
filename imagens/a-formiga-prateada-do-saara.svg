         id="path16" />
      <path
         d="M 196,102 330,204"
         marker-end="url(#s-f5b13c)"
         id="path17" />
    </g>
    <!-- reflexos saindo -->
    <g
       stroke="#e8942e"
       stroke-width="3"
       fill="none"
       id="g19"
       transform="translate(0,-4)">
      <path
         d="m 266,206 74,-64"
         marker-end="url(#s-e8942e)"
         id="path18" />
      <path
         d="m 338,206 78,-50"
