    <rect
       class="painel"
       x="0"
       y="0"
       width="812"
       height="380"
       rx="16"
       id="rect13" />
    <text
       class="rot"
       x="24"
       y="38"
       id="text14">O PELO, EM CORTE — UM TRIÂNGULO</text>
    <text
       class="rotp"
       x="24"
       y="60"
       id="text15">dois lados virados para o Sol; a base, encostada no corpo</text>
    <!-- o Sol -->
