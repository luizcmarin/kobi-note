           y="332"
           text-anchor="middle"
           id="text35">sem os pelos</text>
        <text
           class="rotp"
           x="0"
           y="352"
           text-anchor="middle"
           style="fill:#c0392b"
           id="text36">morre</text>
      </g>
      <!-- só reflete: 56 -->
      <g
         transform="translate(234,0)"
         id="g39">
        <rect
           x="-26"
           y="214"
           width="52"
           height="96"
